<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiToken | Sorteio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #334155; overflow-x: hidden; }
        .bg-animated { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('https://multitoken.top/images/background2.jpg'); background-size: cover; background-position: center; z-index: -2; animation: breathe 25s ease-in-out infinite alternate; }
        @keyframes breathe { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; backdrop-filter: none; z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15); backdrop-filter: blur(16px); }
        .input-form { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; transition: 0.3s; color: #334155; font-size: 0.95rem; font-weight: 600; background: rgba(255,255,255,0.9); }
        .input-form:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center justify-center">

    <div class="bg-animated"></div>
    <div class="bg-overlay"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-3xl mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Sorteio MITK</h1>
            <p class="text-sm text-gray-600 mt-2">Faça login ou cadastre-se com sua carteira e um PIN de 6 dígitos.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Carteira Solana</label>
                <input type="text" id="wallet" class="input-form" placeholder="Ex: 8xG... " required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">PIN (6 números)</label>
                <input type="password" id="pin" class="input-form" placeholder="123456" pattern="\d{6}" maxlength="6" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg mt-4">
                Entrar / Cadastrar
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const wallet = document.getElementById('wallet').value.trim();
            const pin = document.getElementById('pin').value;

            try {
                Swal.fire({ title: 'Aguarde...', didOpen: () => { Swal.showLoading(); } });
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ walletAddress: wallet, pin })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('lottery_token', data.token);
                    window.location.href = '/dashboard.html';
                } else {
                    Swal.fire('Erro', data.error, 'error');
                }
            } catch (error) {
                Swal.fire('Erro', 'Erro de conexão.', 'error');
            }
        }

        // Se já estiver logado, redireciona
        if (localStorage.getItem('lottery_token')) {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
